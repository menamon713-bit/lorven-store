<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LORVEN | Zero Gravity</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --cream: #F5F0E6; /* لون اللوجو الكريمي */
            --text: #FFFFFF;
            --text-muted: #888888;
            --border: #222222;
            --font-head: 'Oswald', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            overflow-x: hidden;
        }

        /* --- Intro Screen --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #intro-screen.hidden { opacity: 0; visibility: hidden; }

        /* 🔴 اللوجو */
        .intro-logo-img {
            width: 180px; 
            height: auto;
            object-fit: contain;
            animation: pulseLogo 2s infinite alternate;
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(245, 240, 230, 0.1)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(245, 240, 230, 0.4)); }
        }

        .intro-text {
            font-family: var(--font-head);
            font-size: 28px; letter-spacing: 8px;
            color: var(--cream); margin-top: 20px;
        }

        .skip-btn {
            position: absolute; top: 30px; right: 30px;
            background: transparent; border: 1px solid var(--border);
            color: var(--text-muted); padding: 10px 20px;
            font-size: 10px; letter-spacing: 2px; cursor: pointer;
            transition: 0.3s;
        }
        .skip-btn:hover { color: var(--cream); border-color: var(--cream); }

        /* --- Navbar --- */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(10px);
            z-index: 100; border-bottom: 1px solid var(--border);
        }

        .nav-left { display: flex; align-items: center; gap: 12px; }
        
        .nav-logo-img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .nav-logo-text { font-family: var(--font-head); font-size: 22px; font-weight: 700; letter-spacing: 4px; color: var(--cream); }

        .cart-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--cream); padding: 10px 20px;
            font-size: 12px; font-weight: 600; letter-spacing: 2px; cursor: pointer;
            transition: 0.3s;
        }
        .cart-btn:hover { border-color: var(--cream); }

        /* --- Hero Section --- */
        .hero {
            min-height: 60vh; display: flex; align-items: center; justify-content: center;
            text-align: center; flex-direction: column; padding: 120px 20px 40px;
        }

        .hero-pretitle { color: var(--cream); font-size: 12px; letter-spacing: 3px; margin-bottom: 15px; font-weight: 600; }
        
        .hero-title {
            font-family: var(--font-head); font-size: clamp(50px, 10vw, 100px);
            line-height: 0.9; text-transform: uppercase; margin-bottom: 20px;
        }
        
        .hero-title span { display: block; color: transparent; -webkit-text-stroke: 1px var(--cream); }

        /* --- Showcase (الهوديز الطايرة) --- */
        .showcase-section {
            position: relative;
            width: 100%;
            min-height: 70vh;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 50px;
            background: radial-gradient(circle at center, #111 0%, #050505 70%);
            padding: 60px 20px;
            overflow: hidden;
        }

        .glow-ring {
            position: absolute;
            width: 400px; height: 400px;
            border: 1px solid rgba(245, 240, 230, 0.1);
            border-radius: 50%;
            animation: spin 20s linear infinite;
            z-index: 1;
        }
        .glow-ring::before {
            content: ''; position: absolute; top: 10%; left: 10%;
            width: 8px; height: 8px; background: var(--cream); border-radius: 50%;
            box-shadow: 0 0 15px var(--cream);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .floating-item {
            position: relative;
            width: 300px;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.3s;
        }

        /* حاوية الصورة */
        .floating-img-container {
            background-color: var(--cream); 
            border-radius: 20px;
            padding: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .floating-item img {
            width: 100%;
            mix-blend-mode: multiply; 
            animation: float1 6s ease-in-out infinite;
        }

        .floating-item:nth-child(3) img {
            animation: float2 7s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-25px) rotate(2deg); }
        }

        @keyframes float2 {
            0%, 100% { transform: translateY(0) rotate(2deg); }
            50% { transform: translateY(25px) rotate(-2deg); }
        }

        /* --- Collection Grid --- */
        .collection {
            padding: 80px 5%; max-width: 1200px; margin: 0 auto;
        }

        .section-title {
            font-family: var(--font-head); font-size: 32px; text-transform: uppercase;
            border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 40px;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; }

        .product-card { cursor: pointer; }

        .img-wrapper {
            background-color: var(--cream);
            aspect-ratio: 4/5; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative; transition: transform 0.4s ease;
            border-radius: 10px;
        }

        .img-wrapper img {
            width: 85%; height: 85%; object-fit: contain;
            mix-blend-mode: multiply; 
            transition: transform 0.5s ease;
        }

        .product-card:hover .img-wrapper { transform: translateY(-5px); }
        .product-card:hover .img-wrapper img { transform: scale(1.05); }

        .product-info { padding-top: 15px; display: flex; justify-content: space-between; }
        .product-name { font-family: var(--font-head); font-size: 18px; text-transform: uppercase; }
        .product-price { font-weight: 600; color: var(--cream); }

        /* --- Footer --- */
        footer { padding: 40px; border-top: 1px solid var(--border); text-align: center; color: var(--text-muted); font-size: 12px; letter-spacing: 2px;}

        /* --- Modal --- */
        .modal { position: fixed; inset: 0; background: rgba(5,5,5,0.95); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px);}
        .modal.active { display: flex; }
        .modal-content { background: var(--bg); border: 1px solid var(--border); width: 100%; max-width: 800px; display: flex; flex-direction: column; position: relative; border-radius: 15px; overflow: hidden; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--text); font-size: 30px; cursor: pointer; z-index: 10;}
        
        .modal-body { display: flex; flex-direction: column; }
        .modal-img-container { background: var(--cream); padding: 40px; display: flex; justify-content: center; }
        .modal-img-container img { width: 100%; max-width: 300px; mix-blend-mode: multiply; }
        .modal-details { padding: 30px; }
        .modal-title { font-family: var(--font-head); font-size: 28px; text-transform: uppercase; margin-bottom: 10px; }
        .modal-price { font-size: 20px; color: var(--cream); margin-bottom: 20px; font-weight: bold;}
        
        .sizes { display: flex; gap: 10px; margin-bottom: 30px; }
        .size-btn { width: 45px; height: 45px; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: 0.3s; font-weight: bold;}
        .size-btn.active, .size-btn:hover { border-color: var(--cream); background: var(--cream); color: var(--bg); }
        
        .add-to-cart-btn { width: 100%; padding: 15px; background: var(--cream); color: var(--bg); border: none; font-weight: 900; cursor: pointer; letter-spacing: 2px; transition: 0.3s;}
        .add-to-cart-btn:hover { background: #fff; box-shadow: 0 0 20px rgba(245,240,230,0.3); }

        /* --- Cart Sidebar --- */
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; opacity: 0; transition: 0.3s; }
        .cart-overlay.open { display: block; opacity: 1; }
        .cart-sidebar { position: fixed; top: 0; right: -100%; width: 100%; max-width: 350px; height: 100vh; background: #080808; border-left: 1px solid var(--border); z-index: 2001; transition: right 0.3s; display: flex; flex-direction: column; }
        .cart-sidebar.open { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
        .cart-title { font-family: var(--font-head); font-size: 20px; }
        .close-cart { background: transparent; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .cart-item-img { width: 60px; height: 80px; background: var(--cream); display: flex; justify-content: center; align-items: center; border-radius: 5px;}
        .cart-item-img img { width: 90%; mix-blend-mode: multiply; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-family: var(--font-head); font-size: 14px; margin-bottom: 5px; }
        .cart-item-price { color: var(--cream); font-size: 12px; margin-bottom: 10px; }
        .remove-item { background: transparent; border: none; color: #ff3333; cursor: pointer; font-size: 10px; text-decoration: underline; }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border); }
        .cart-total { display: flex; justify-content: space-between; font-family: var(--font-head); font-size: 20px; margin-bottom: 15px; }
        .checkout-btn { width: 100%; padding: 15px; background: #25D366; color: #000; border: none; font-weight: 900; cursor: pointer; letter-spacing: 1px; transition: 0.3s;}
        .checkout-btn:hover { background: #1eb356; }

        @media (max-width: 768px) {
            .hero-title { font-size: 50px; }
            .floating-item { width: 250px; }
            .modal-body { flex-direction: column; }
        }
        @media (min-width: 768px) {
            .modal-body { flex-direction: row; }
            .modal-img-container { width: 50%; align-items: center; }
            .modal-details { width: 50%; }
        }
    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="intro-screen">
        <button class="skip-btn" onclick="skipIntro()">SKIP INTRO ↗</button>
        
        <!-- 🔴 اللوجو المحلي -->
        <img src="logo.png" alt="LORVEN Logo" class="intro-logo-img">
        <div class="intro-text">LORVEN</div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <!-- 🔴 اللوجو المحلي -->
            <img src="logo.png" alt="LORVEN Logo" class="nav-logo-img">
            <div class="nav-logo-text">LORVEN</div>
        </div>
        <button class="cart-btn" onclick="toggleCart()">
            BAG [ <span id="cart-count">0</span> ]
        </button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-pretitle">LORVEN / DROP 001</div>
        <h1 class="hero-title">
            BREAK<br>
            <span>THE LIMITS.</span>
        </h1>
    </section>

    <!-- Showcase (الهوديز الطايرة) -->
    <section class="showcase-section">
        <div class="glow-ring"></div>
        
        <div class="floating-item" onclick="scrollToCollection()">
            <div class="floating-img-container">
                <!-- 🔴 الهودي الأول المحلي -->
                <img src="hoodie1.jpg" alt="Hoodie 1">
            </div>
        </div>

        <div class="floating-item" onclick="scrollToCollection()">
            <div class="floating-img-container">
                <!-- 🔴 الهودي التاني المحلي -->
                <img src="hoodie2.jpg" alt="Hoodie 2">
            </div>
        </div>
    </section>

    <!-- Collection Section -->
    <section class="collection" id="collection">
        <h2 class="section-title">THE COLLECTION.</h2>
        <div class="grid" id="product-grid"></div>
    </section>

    <!-- Footer -->
    <footer>© 2026 LORVEN. ZERO GRAVITY.</footer>

    <!-- Modal -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div class="modal-body">
                <div class="modal-img-container">
                    <img src="" alt="" id="modal-img">
                </div>
                <div class="modal-details">
                    <h2 class="modal-title" id="modal-title"></h2>
                    <div class="modal-price" id="modal-price"></div>
                    <div class="sizes">
                        <button class="size-btn" onclick="selectSize(this)">S</button>
                        <button class="size-btn active" onclick="selectSize(this)">M</button>
                        <button class="size-btn" onclick="selectSize(this)">L</button>
                        <button class="size-btn" onclick="selectSize(this)">XL</button>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart()">ADD TO BAG +</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2 class="cart-title">YOUR BAG</h2>
            <button class="close-cart" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>TOTAL</span>
                <span id="cart-total">0 EGP</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">CHECKOUT VIA WHATSAPP</button>
        </div>
    </div>

    <script>
        function skipIntro() { document.getElementById('intro-screen').classList.add('hidden'); }
        setTimeout(skipIntro, 3500);

        // 🔴 صور المنتجات المحلية
        const products = [
            { id: 1, name: "ZERO GRAVITY HOODIE", price: 850, img: "hoodie1.jpg" },
            { id: 2, name: "HEART OF THE GAME", price: 850, img: "hoodie2.jpg" }
        ];

        const grid = document.getElementById('product-grid');
        let currentProduct = null;
        let currentSize = 'M';
        let cart = JSON.parse(localStorage.getItem('lorven_cart')) || [];

        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="img-wrapper"><img src="${p.img}" alt="${p.name}"></div>
                <div class="product-info">
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price} EGP</div>
                </div>
            `;
            card.onclick = () => openModal(p);
            grid.appendChild(card);
        });

        function openModal(product) {
            currentProduct = product;
            document.getElementById('modal-img').src = product.img;
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = product.price + " EGP";
            document.getElementById('product-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('product-modal').classList.remove('active'); }
        
        function selectSize(btn) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSize = btn.innerText;
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
            document.getElementById('cart-overlay').classList.toggle('open');
        }

        function addToCart() {
            const existing = cart.find(item => item.id === currentProduct.id && item.size === currentSize);
            if (existing) existing.qty += 1;
            else cart.push({ ...currentProduct, size: currentSize, qty: 1 });
            
            saveCart();
            closeModal();
            toggleCart();
        }

        function saveCart() {
            localStorage.setItem('lorven_cart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const countEl = document.getElementById('cart-count');
            
            container.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                count += item.qty;
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-img"><img src="${item.img}"></div>
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${item.price} EGP | SIZE: ${item.size}</div>
                            <div style="font-size:10px; color:#888;">Qty: ${item.qty}</div>
                            <button class="remove-item" onclick="removeFromCart(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });

            if (cart.length === 0) container.innerHTML = '<p style="text-align:center; color:#666; margin-top:50px;">Your bag is empty.</p>';
            totalEl.innerText = total + " EGP";
            countEl.innerText = count;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("Your bag is empty!");
            let msg = "Hello LORVEN, I'd like to order:\n\n";
            let total = 0;
            cart.forEach(item => {
                msg += `▪️ ${item.name} (Size: ${item.size}) x${item.qty} = ${item.price * item.qty} EGP\n`;
                total += item.price * item.qty;
            });
            msg += `\n💰 Total: ${total} EGP`;
            window.open(`https://api.whatsapp.com/send?phone=201017351246&text=${encodeURIComponent(msg)}`, '_blank');
        }

        function scrollToCollection() {
            document.getElementById('collection').scrollIntoView({ behavior: 'smooth' });
        }

        renderCart();
    </script>
</body>
</html>
