<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LORDVEN EG | Zero Gravity</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --cream: #F5F0E6; 
            --text: #FFFFFF;
            --text-muted: #888888;
            --border: #222222;
            --font-head: 'Oswald', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background: radial-gradient(circle at 50% 0%, #111 0%, var(--bg) 70%);
            color: var(--text);
            font-family: var(--font-body);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Custom Cursor --- */
        .cursor {
            position: fixed; width: 20px; height: 20px; border-radius: 50%;
            background: var(--cream); pointer-events: none; z-index: 99999;
            transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s, background 0.3s;
            mix-blend-mode: difference; display: flex; justify-content: center; align-items: center;
            font-size: 10px; font-weight: bold; color: #000; letter-spacing: 1px;
        }
        .cursor.hovered { width: 80px; height: 80px; background: var(--cream); mix-blend-mode: normal; }
        .cursor.hovered::after { content: 'VIEW'; }

        /* --- Intro Screen --- */
        #intro-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        #intro-screen.hidden { opacity: 0; visibility: hidden; }
        
        .intro-logo-img { 
            width: 180px; height: auto; object-fit: contain; 
            animation: pulseLogo 2s infinite alternate; 
        }
        @keyframes pulseLogo {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 15px rgba(245, 240, 230, 0.6)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 50px rgba(245, 240, 230, 1)); }
        }
        
        .intro-text { font-family: var(--font-head); font-size: 28px; letter-spacing: 8px; color: var(--cream); margin-top: 20px; text-shadow: 0 0 20px var(--cream); }
        .skip-btn { position: absolute; top: 30px; right: 30px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 10px 20px; font-size: 10px; letter-spacing: 2px; cursor: none; transition: 0.3s; }
        .skip-btn:hover { color: var(--cream); border-color: var(--cream); box-shadow: 0 0 15px rgba(245,240,230,0.3); }

        /* --- Navbar --- */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(10px);
            z-index: 500; /* رفعنا الرقم عشان يبقى فوق أي حاجة */
            border-bottom: 1px solid var(--border);
        }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .nav-logo-img { width: 30px; height: 30px; object-fit: contain; filter: drop-shadow(0 0 10px var(--cream)); }
        .nav-logo-text { font-family: var(--font-head); font-size: 22px; font-weight: 700; letter-spacing: 4px; color: var(--cream); }
        
        /* زرار السلة */
        .cart-btn { 
            background: transparent; border: 1px solid var(--border); color: var(--cream); 
            padding: 10px 20px; font-size: 12px; font-weight: 600; letter-spacing: 2px; 
            cursor: pointer; transition: 0.3s; z-index: 600; position: relative;
        }
        .cart-btn:hover { border-color: var(--cream); box-shadow: 0 0 20px rgba(245,240,230,0.3); }

        /* --- Hero Section --- */
        .hero { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; flex-direction: column; padding: 120px 20px 40px; }
        .hero-pretitle { color: var(--cream); font-size: 12px; letter-spacing: 3px; margin-bottom: 15px; font-weight: 600; }
        .hero-title { font-family: var(--font-head); font-size: clamp(50px, 10vw, 100px); line-height: 0.9; text-transform: uppercase; margin-bottom: 20px; position: relative; color: var(--cream); }
        
        /* Glitch Effect */
        .glitch { position: relative; display: inline-block; }
        .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .glitch::before { left: 2px; text-shadow: -2px 0 red; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -2px 0 blue; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip: rect(10px, 9999px, 83px, 0); } 20% { clip: rect(62px, 9999px, 14px, 0); } 40% { clip: rect(33px, 9999px, 71px, 0); } 60% { clip: rect(89px, 9999px, 22px, 0); } 80% { clip: rect(45px, 9999px, 58px, 0); } 100% { clip: rect(11px, 9999px, 92px, 0); } }
        @keyframes glitch-anim2 { 0% { clip: rect(65px, 9999px, 100px, 0); } 20% { clip: rect(12px, 9999px, 56px, 0); } 40% { clip: rect(78px, 9999px, 33px, 0); } 60% { clip: rect(22px, 9999px, 88px, 0); } 80% { clip: rect(55px, 9999px, 44px, 0); } 100% { clip: rect(91px, 9999px, 11px, 0); } }

        /* --- Showcase (الهوديز الطايرة) --- */
        .showcase-section {
            position: relative; width: 100%; min-height: 70vh; display: flex; flex-wrap: wrap;
            justify-content: center; align-items: center; gap: 60px; padding: 60px 20px; overflow: hidden;
            z-index: 10; /* عشان ميتداخلش مع الناف بار */
        }
        .glow-ring { position: absolute; width: 450px; height: 450px; border: 1px solid rgba(245, 240, 230, 0.05); border-radius: 50%; animation: spin 20s linear infinite; z-index: 1; }
        .glow-ring::before { content: ''; position: absolute; top: 10%; left: 10%; width: 10px; height: 10px; background: var(--cream); border-radius: 50%; box-shadow: 0 0 25px var(--cream); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .floating-item { position: relative; width: 320px; z-index: 2; cursor: none; transition: transform 0.3s; }
        
        /* 🔴 السحر اللي بيشيل المربع الأسود ويزود الإضاءة */
        .floating-item img { 
            width: 100%; 
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 30px rgba(245, 240, 230, 0.8)) drop-shadow(0 0 60px rgba(245, 240, 230, 0.4));
            animation: float1 6s ease-in-out infinite; 
        }
        .floating-item:nth-child(3) img { animation: float2 7s ease-in-out infinite; }
        @keyframes float1 { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-30px) rotate(3deg); } }
        @keyframes float2 { 0%, 100% { transform: translateY(0) rotate(3deg); } 50% { transform: translateY(30px) rotate(-3deg); } }

        /* --- Collection Grid & 3D Tilt --- */
        .collection { padding: 80px 5%; max-width: 1200px; margin: 0 auto; position: relative; z-index: 10;}
        .section-title { font-family: var(--font-head); font-size: 32px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 40px; text-shadow: 0 0 10px var(--cream); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; perspective: 1000px; }
        
        .product-card { 
            cursor: none; transform-style: preserve-3d; transition: transform 0.1s ease, box-shadow 0.3s ease;
            position: relative; background: #111; border-radius: 15px; padding: 20px; border: 1px solid #222;
        }
        .product-card:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1); border-color: var(--cream); }

        .img-wrapper { aspect-ratio: 4/5; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; transform: translateZ(20px); }
        
        .img-wrapper img { 
            width: 90%; height: 90%; object-fit: contain; 
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 25px rgba(245, 240, 230, 0.6)); 
            transition: transform 0.5s ease; 
        }
        
        .product-info { padding-top: 15px; display: flex; justify-content: space-between; transform: translateZ(30px); }
        .product-name { font-family: var(--font-head); font-size: 18px; text-transform: uppercase; }
        .product-price { font-weight: 600; color: var(--cream); }

        .reveal { opacity: 0; transform: translateY(50px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        footer { padding: 40px; border-top: 1px solid var(--border); text-align: center; color: var(--text-muted); font-size: 12px; letter-spacing: 2px; position: relative; z-index: 10;}

        /* --- Modal & Cart --- */
        .modal { position: fixed; inset: 0; background: rgba(5,5,5,0.95); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px);}
        .modal.active { display: flex; }
        .modal-content { background: #0a0a0a; border: 1px solid var(--border); width: 100%; max-width: 800px; display: flex; flex-direction: column; position: relative; border-radius: 15px; overflow: hidden; box-shadow: 0 0 50px rgba(255,255,255,0.1); }
        .close-modal { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--text); font-size: 30px; cursor: pointer; z-index: 10; transition: 0.3s;}
        
        .modal-body { display: flex; flex-direction: column; }
        .modal-img-container { background: #111; padding: 40px; display: flex; justify-content: center; }
        
        .modal-img-container img { 
            width: 100%; max-width: 300px; 
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 30px rgba(245,240,230,0.8)) drop-shadow(0 0 60px rgba(245,240,230,0.4)); 
        }
        
        .modal-details { padding: 30px; }
        .modal-title { font-family: var(--font-head); font-size: 28px; text-transform: uppercase; margin-bottom: 10px; }
        .modal-price { font-size: 20px; color: var(--cream); margin-bottom: 20px; font-weight: bold;}
        .sizes { display: flex; gap: 10px; margin-bottom: 30px; }
        .size-btn { width: 45px; height: 45px; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: 0.3s; font-weight: bold;}
        .size-btn.active, .size-btn:hover { border-color: var(--cream); background: var(--cream); color: var(--bg); box-shadow: 0 0 15px rgba(245,240,230,0.3); }
        .add-to-cart-btn { width: 100%; padding: 15px; background: var(--cream); color: var(--bg); border: none; font-weight: 900; cursor: pointer; letter-spacing: 2px; transition: 0.3s;}
        .add-to-cart-btn:hover { background: #fff; box-shadow: 0 0 30px rgba(245,240,230,0.6); }

        /* 🔴 السلة الجانبية */
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; opacity: 0; transition: 0.3s; cursor: pointer;}
        .cart-overlay.open { display: block; opacity: 1; }
        
        .cart-sidebar { 
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 350px; height: 100vh; 
            background: #0a0a0a; border-left: 1px solid var(--border); z-index: 2001; 
            transition: right 0.3s; display: flex; flex-direction: column; cursor: default; 
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }
        .cart-sidebar.open { right: 0; }
        
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
        .cart-title { font-family: var(--font-head); font-size: 20px; }
        .close-cart { background: transparent; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .cart-item-img { width: 60px; height: 80px; background: #111; display: flex; justify-content: center; align-items: center; border-radius: 5px;}
        .cart-item-img img { width: 90%; mix-blend-mode: screen; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-family: var(--font-head); font-size: 14px; margin-bottom: 5px; }
        .cart-item-price { color: var(--cream); font-size: 12px; margin-bottom: 10px; }
        .remove-item { background: transparent; border: none; color: #ff3333; cursor: pointer; font-size: 10px; text-decoration: underline; }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border); }
        .cart-total { display: flex; justify-content: space-between; font-family: var(--font-head); font-size: 20px; margin-bottom: 15px; }
        .checkout-btn { width: 100%; padding: 15px; background: #25D366; color: #000; border: none; font-weight: 900; cursor: pointer; letter-spacing: 1px; transition: 0.3s;}
        .checkout-btn:hover { background: #1eb356; box-shadow: 0 0 20px #25D366; }

        @media (max-width: 768px) {
            * { cursor: auto; }
            .cursor { display: none; }
            .hero-title { font-size: 50px; }
            .floating-item { width: 260px; }
            .modal-body { flex-direction: column; }
        }
        @media (min-width: 768px) {
            .modal-body { flex-direction: row; }
            .modal-img-container { width: 50%; align-items: center; }
            .modal-details { width: 50%; }
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>

    <div id="intro-screen">
        <button class="skip-btn" onclick="skipIntro()">SKIP INTRO ↗</button>
        <img src="logo.png" alt="LORDVEN EG Logo" class="intro-logo-img">
        <div class="intro-text">LORDVEN EG</div>
    </div>

    <nav class="navbar">
        <div class="nav-left">
            <img src="logo.png" alt="LORDVEN EG Logo" class="nav-logo-img">
            <div class="nav-logo-text">LORDVEN EG</div>
        </div>
        <button class="cart-btn" id="open-cart-btn">
            BAG [ <span id="cart-count">0</span> ]
        </button>
    </nav>

    <section class="hero">
        <div class="hero-pretitle">LORDVEN EG / DROP 001</div>
        <h1 class="hero-title">
            <div class="glitch" data-text="BREAK">BREAK</div>
            <span class="glitch" data-text="THE LIMITS." style="display:block; color: transparent; -webkit-text-stroke: 1px var(--cream);">THE LIMITS.</span>
        </h1>
    </section>

    <section class="showcase-section">
        <div class="glow-ring"></div>
        <div class="floating-item" onclick="scrollToCollection()">
            <img src="hoodie1.png" alt="Hoodie 1">
        </div>
        <div class="floating-item" onclick="scrollToCollection()">
            <img src="hoodie2.png" alt="Hoodie 2">
        </div>
    </section>

    <section class="collection" id="collection">
        <h2 class="section-title">THE COLLECTION.</h2>
        <div class="grid" id="product-grid"></div>
    </section>

    <footer>© 2026 LORDVEN EG. ZERO GRAVITY.</footer>

    <div class="modal" id="product-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div class="modal-body">
                <div class="modal-img-container">
                    <img src="" alt="" id="modal-img">
                </div>
                <div class="modal-details">
                    <h2 class="modal-title" id="modal-title"></h2>
                    <div class="modal-price" id="modal-price"></div>
                    <div class="sizes">
                        <button class="size-btn" onclick="selectSize(this)">S</button>
                        <button class="size-btn active" onclick="selectSize(this)">M</button>
                        <button class="size-btn" onclick="selectSize(this)">L</button>
                        <button class="size-btn" onclick="selectSize(this)">XL</button>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart()">ADD TO BAG +</button>
                </div>
            </div>
        </div>
    </div>

    <!-- السلة الجانبية -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2 class="cart-title">YOUR BAG</h2>
            <button class="close-cart" id="close-cart-btn">×</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>TOTAL</span>
                <span id="cart-total">0 EGP</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">CHECKOUT VIA WHATSAPP</button>
        </div>
    </div>

    <script>
        // ربط زراير السلة بالجافاسكريبت
        document.getElementById('open-cart-btn').addEventListener('click', toggleCart);
        document.getElementById('close-cart-btn').addEventListener('click', toggleCart);
        document.getElementById('cart-overlay').addEventListener('click', toggleCart);

        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.querySelectorAll('.product-card, .floating-item, .cart-btn, .add-to-cart-btn, .size-btn, .close-modal, .close-cart, .checkout-btn, .skip-btn, .remove-item').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('active'); observer.unobserve(entry.target); }
            });
        }, { threshold: 0.1 });

        function skipIntro() { document.getElementById('intro-screen').classList.add('hidden'); }
        setTimeout(skipIntro, 3500);

        const products = [
            { id: 1, name: "ZERO GRAVITY HOODIE", price: 850, img: "hoodie1.png" },
            { id: 2, name: "HEART OF THE GAME", price: 850, img: "hoodie2.png" }
        ];

        const grid = document.getElementById('product-grid');
        let currentProduct = null;
        let currentSize = 'M';
        let cart = JSON.parse(localStorage.getItem('lordven_eg_cart')) || [];

        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card reveal'; 
            card.innerHTML = `
                <div class="img-wrapper"><img src="${p.img}" alt="${p.name}"></div>
                <div class="product-info">
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price} EGP</div>
                </div>
            `;
            
            card.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            card.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));

            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -15; 
                const rotateY = ((x - centerX) / centerX) * 15;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });

            card.onclick = () => openModal(p);
            grid.appendChild(card);
            observer.observe(card);
        });

        function openModal(product) {
            currentProduct = product;
            document.getElementById('modal-img').src = product.img;
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = product.price + " EGP";
            document.getElementById('product-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('product-modal').classList.remove('active'); }
        function selectSize(btn) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSize = btn.innerText;
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
            document.getElementById('cart-overlay').classList.toggle('open');
        }

        function addToCart() {
            const existing = cart.find(item => item.id === currentProduct.id && item.size === currentSize);
            if (existing) existing.qty += 1;
            else cart.push({ ...currentProduct, size: currentSize, qty: 1 });
            saveCart();
            closeModal();
            toggleCart(); // بيفتح السلة تلقائياً لما تضيف منتج
        }

        function saveCart() {
            localStorage.setItem('lordven_eg_cart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const countEl = document.getElementById('cart-count');
            container.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                count += item.qty;
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-img"><img src="${item.img}"></div>
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${item.price} EGP | SIZE: ${item.size}</div>
                            <div style="font-size:10px; color:#888;">Qty: ${item.qty}</div>
                            <button class="remove-item" onclick="removeFromCart(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });

            if (cart.length === 0) container.innerHTML = '<p style="text-align:center; color:#666; margin-top:50px;">Your bag is empty.</p>';
            totalEl.innerText = total + " EGP";
            countEl.innerText = count;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("Your bag is empty!");
            let msg = "Hello LORDVEN EG, I'd like to order:\n\n";
            let total = 0;
            cart.forEach(item => {
                msg += `▪️ ${item.name} (Size: ${item.size}) x${item.qty} = ${item.price * item.qty} EGP\n`;
                total += item.price * item.qty;
            });
            msg += `\n💰 Total: ${total} EGP`;
            
            const encodedMsg = encodeURIComponent(msg);
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            if (isAndroid) {
                const intentLink = `intent://send?phone=201017351246&text=${encodedMsg}#Intent;scheme=whatsapp;package=com.whatsapp;end`;
                window.location.href = intentLink;
            } else {
                const webLink = `https://api.whatsapp.com/send?phone=201017351246&text=${encodedMsg}`;
                window.open(webLink, '_blank');
            }
        }

        function scrollToCollection() {
            document.getElementById('collection').scrollIntoView({ behavior: 'smooth' });
        }

        renderCart();
    </script>
</body>
</html>
